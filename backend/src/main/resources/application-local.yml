# Host 직접 실행 환경 (gradlew bootRun).
# 공통 server / jpa 설정은 application.yml 에서 상속.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_factory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: smart_factory
    password: smart_factory

phm:
  mqtt:
    host: localhost
    port: 1883
    vibration-topic: factory/motor/1/vibration/window
    qos: 1
  ai-api:
    base-url: http://localhost:8001
  storage:
    raw-window-dir: ../data/raw_windows
  opcua:
    x-das:
      # local 프로필 기본값은 false. OPC UA 브로커가 호스트에 띄워져 있을 때만 환경변수로 true 지정.
      # 사이드 이펙트: 미실행 시 5초마다 반복되던 "Connection refused" 경고 로그 사라짐.
      enabled: ${PHM_OPCUA_XDAS_ENABLED:false}
      endpoint-url: ${PHM_OPCUA_XDAS_ENDPOINT_URL:opc.tcp://localhost:54880/UA/X_DAS/}
      publishing-interval-ms: ${PHM_OPCUA_XDAS_PUBLISHING_INTERVAL_MS:1000}
      queue-size: ${PHM_OPCUA_XDAS_QUEUE_SIZE:10}
      reconnect-delay-ms: ${PHM_OPCUA_XDAS_RECONNECT_DELAY_MS:5000}
      include-line01-alias-buffers: ${PHM_OPCUA_XDAS_INCLUDE_LINE01_ALIAS_BUFFERS:true}
