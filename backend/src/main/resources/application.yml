spring:
  application:
    name: smart-factory-phm-backend
  profiles:
    active: local
    group:
      # Host backend + Docker infra (docker-compose.local-infra.yml)
      local-docker:
        - local
        - local-infra
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

# 모든 프로필 공통 server 설정 (포트는 SERVER_PORT 환경변수로 오버라이드 가능).
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
