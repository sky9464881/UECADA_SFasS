server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/uecada?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:uecada_user}
    password: ${MYSQL_PASSWORD:uecada1234}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

phm:
  mqtt:
    host: mosquitto
    port: 1883
    vibration-topic: ${MQTT_VIBRATION_TOPIC:factory/motor/1/vibration/window}
    qos: ${MQTT_QOS:1}
  ai-api:
    base-url: http://ai-api:8001
  storage:
    raw-window-dir: /app/data/raw_windows
