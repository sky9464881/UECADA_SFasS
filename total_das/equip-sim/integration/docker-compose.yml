# integration/docker-compose.yml
# ---------------------------------------------------------------
# Integration DAS (3 lines merged) Node-RED container.
#
# - Joins the external `factory-net` network and reaches each
#   line container by name (nodered-line01/02/03).
# - UI: http://localhost:5880
# - OPC UA: opc.tcp://localhost:5860/integration-das
#
# Flow JSON is baked into the image at /data/flows.json so the
# Node-RED editor's save-rename does not hit EBUSY.
#
# Prereqs (handled by ../scripts/up-all.{sh,ps1}):
#   docker network create factory-net
#   python ../integration/build_flow_integration.py
# ---------------------------------------------------------------

services:
  nodered-das:
    build:
      # context is repo root so we can COPY integration/<flow>.json
      context: ..
      dockerfile: integration/Dockerfile.nodered
      args:
        FLOW_FILE: integration/flows_integration.json
    image: equip-sim-nodered-das:4.1.10-22
    container_name: nodered-das
    hostname: nodered-das
    restart: unless-stopped
    ports:
      - "5880:1880"   # Node-RED UI
      - "5860:5860"   # Integration OPC UA Server
    # No /data bind-mount: image already has flows.json and
    # Node-RED needs to be able to rewrite it freely.
    environment:
      - TZ=Asia/Seoul
      - NODE_RED_ENABLE_PROJECTS=false
    networks:
      - factory-net

networks:
  factory-net:
    external: true
