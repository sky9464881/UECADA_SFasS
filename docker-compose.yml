services:
  mysql:
    image: mysql:8.0
    container_name: uecada_mysql
    restart: always
    ports:
      - "8600:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: uecada
      MYSQL_USER: uecada_user
      MYSQL_PASSWORD: uecada1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/init/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-uuecada_user", "-puecada1234", "-e", "SELECT 1 FROM uecada.analysis_result LIMIT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


volumes:
  mysql_data:
