<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공정 흐름도 - 드롭다운</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #f7f8fa;
    color: #1a2236;
    padding: 24px;
    min-height: 100vh;
  }

  /* 상단 라인 카드 */
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .line-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; flex: 1; }
  .line-card {
    background: #fff; border: 1.5px solid #e3e8f0;
    border-radius: 12px; padding: 14px 20px;
    text-align: center; cursor: pointer; transition: all 0.15s;
  }
  .line-card:hover { border-color: #b8c5d9; }
  .line-card.active-blue { background: #eef4fc; border-color: #4a7fc1; }
  .line-card.active-red  { background: #fdf0f0; border-color: #d97070; }
  .line-card .label { font-size: 12px; color: #6b7a92; margin-bottom: 4px; }
  .line-card .name  { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .line-card .oee   { font-size: 13px; color: #4a7fc1; font-weight: 600; }
  .line-card.active-red .oee { color: #d97070; }

  .status-chips { display: flex; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.normal { background:#e8f5ec; color:#2e7d3f; }
  .chip.normal .dot { background:#2e7d3f; }
  .chip.warn   { background:#fdf5d8; color:#9c7a1a; }
  .chip.warn   .dot { background:#e0a82e; }
  .chip.alert  { background:#fde4e4; color:#b53030; }
  .chip.alert  .dot { background:#d04040; }

  .report-btn {
    background: #1a2236; color: #fff; border: none;
    padding: 10px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* 메인 */
  .main-area { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
  .canvas {
    background: #fff; border: 1.5px solid #e3e8f0;
    border-radius: 12px; padding: 24px;
    background-image:
      linear-gradient(rgba(180,195,220,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,195,220,0.15) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .canvas-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 22px;
  }
  .canvas-title { display: flex; align-items: center; gap: 10px; }
  .line-tag {
    background: #eef4fc; color: #4a7fc1;
    padding: 3px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 700;
  }
  .canvas-title h2 { font-size: 16px; font-weight: 700; }
  .flow-summary {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: #4a5a76;
  }

  /* 헤더 행 (버튼 5개 + 화살표 4개) */
  .stage-header-row {
    display: grid;
    grid-template-columns: 1fr 18px 1fr 18px 1fr 18px 1fr 18px 1fr;
    align-items: center;
  }
  .arrow-col {
    text-align: center;
    color: #4a7fc1; font-size: 20px; font-weight: 700;
    user-select: none;
  }

  .stage-btn {
    width: 100%;
    background: #fff;
    border: 1.5px solid #d5deeb;
    border-radius: 10px;
    padding: 14px 12px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all 0.18s ease;
    gap: 6px; min-width: 0;
  }
  .stage-btn:hover { border-color: #4a7fc1; background: #f8fbff; }
  .stage-btn.active {
    border-color: #4a7fc1; background: #eef4fc;
    box-shadow: 0 0 0 3px rgba(74,127,193,0.12);
  }
  .stage-btn .left {
    display: flex; align-items: center; gap: 10px;
    min-width: 0; flex: 1;
  }
  .stage-btn .stage-meta { min-width: 0; flex: 1; }
  .stage-btn .stage-name {
    font-size: 15px; font-weight: 700; color: #1a2236;
    white-space: nowrap;
  }
  .stage-progress { display: flex; gap: 3px; margin-top: 6px; }
  .stage-progress .seg {
    height: 4px; flex: 1; border-radius: 2px; background: #e3e8f0;
  }
  .stage-progress .seg.n { background: #2e7d3f; }
  .stage-progress .seg.w { background: #e0a82e; }
  .stage-progress .seg.a { background: #d04040; }
  .stage-btn .count-badge {
    background: #eef4fc; color: #4a7fc1;
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  .stage-btn.active .count-badge { background: #4a7fc1; color: #fff; }
  .stage-btn .right {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .chevron {
    width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #4a5a76; transition: transform 0.25s ease; font-size: 11px;
  }
  .stage-btn.active .chevron { transform: rotate(180deg); color: #4a7fc1; }

  /* 드롭다운 (전체 너비) */
  .dropdown {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease, margin 0.35s ease, opacity 0.25s ease;
    opacity: 0; margin-top: 0;
  }
  .dropdown.open {
    max-height: 1200px; opacity: 1; margin-top: 12px;
  }
  .dropdown-inner {
    background: #fff;
    border: 1.5px solid #4a7fc1;
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 4px 16px rgba(74,127,193,0.10);
  }
  .dropdown-title {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eef0f5;
  }
  .dropdown-title .ttl-stage { font-size: 15px; font-weight: 700; }
  .dropdown-title .ttl-line { font-size: 12px; color: #8895ad; }

  .equip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }

  .eq {
    display: grid;
    grid-template-columns: 40px 1fr auto 22px;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1.5px solid #d5deeb;
    border-radius: 8px;
    padding: 11px 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    min-width: 0;
  }
  .eq:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(60,90,140,0.10);
    border-color: #4a7fc1;
  }
  .eq.selected {
    border-color: #4a7fc1; border-width: 2px;
    background: #f7faff; padding: 10px 12px;
  }
  .eq .shape-wrap {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .eq .info { min-width: 0; }
  .eq .eq-name { font-size: 13px; font-weight: 700; color: #1a2236; margin-bottom: 2px; }
  .eq .eq-id { font-size: 11px; color: #8895ad; font-weight: 500; }
  .eq .eq-metrics {
    font-size: 10.5px; color: #6b7a92;
    text-align: right; white-space: nowrap; line-height: 1.4;
  }
  .eq .eq-metrics .ct { font-weight: 700; color: #4a5a76; font-size: 12px; }
  .eq .status-icon {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .eq.normal .status-icon { background: #2e7d3f; }
  .eq.warn  { background: #fffdf2; border-color: #e0c878; }
  .eq.warn  .status-icon { background: #d4a52e; }
  .eq.alert { background: #fdf4f4; border-color: #d97070; }
  .eq.alert .status-icon { background: #c43838; }

  /* 우측 상세 */
  .detail-panel {
    background: #fff; border: 1.5px solid #e3e8f0;
    border-radius: 12px; padding: 18px;
    height: fit-content; position: sticky; top: 24px;
  }
  .detail-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 12px;
  }
  .detail-header .ttl { font-size: 13px; color: #4a5a76; font-weight: 600; }
  .detail-name { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .detail-field {
    border: 1.5px solid #e3e8f0; border-radius: 8px;
    padding: 9px 12px; margin-bottom: 8px;
  }
  .detail-field .k { font-size: 11px; color: #8895ad; margin-bottom: 2px; }
  .detail-field .v { font-size: 13px; font-weight: 600; color: #1a2236; }
  .detail-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .recent-status {
    background: #fdf5d8; border-radius: 8px;
    padding: 10px 12px; margin-top: 10px;
  }
  .recent-status .k { font-size: 12px; font-weight: 700; color: #7a5e10; margin-bottom: 4px; }
  .recent-status .v { font-size: 11px; color: #7a5e10; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="line-cards">
    <div class="line-card active-blue">
      <div class="label">Line-A</div>
      <div class="name">라인 A</div>
      <div class="oee">OEE 91%</div>
    </div>
    <div class="line-card active-red">
      <div class="label">Line-B</div>
      <div class="name">라인 B</div>
      <div class="oee">OEE 84%</div>
    </div>
    <div class="line-card">
      <div class="label">Line-C</div>
      <div class="name">라인 C</div>
      <div class="oee" style="color:#4a5a76">OEE 88%</div>
    </div>
  </div>
  <div class="status-chips">
    <span class="chip normal"><span class="dot"></span>정상</span>
    <span class="chip warn"><span class="dot"></span>주의</span>
    <span class="chip alert"><span class="dot"></span>경고</span>
  </div>
  <button class="report-btn">🖨 레포트·인쇄</button>
</div>

<div class="main-area">
  <div class="canvas">
    <div class="canvas-header">
      <div class="canvas-title">
        <span class="line-tag">Line-A</span>
        <h2>라인 A</h2>
      </div>
      <div class="flow-summary">
        <span class="chip normal" style="padding:3px 9px;">정상</span>
        <span>주조 → 가공(3) → 세척(2) → 조립(2) → 검사(2)</span>
      </div>
    </div>

    <div class="stage-header-row" id="stageHeaderRow"></div>
    <div id="dropdownArea"></div>
  </div>

  <div class="detail-panel">
    <div class="detail-header">
      <span class="ttl">📈 설비 상세 정보</span>
      <span class="chip normal" id="detailStatus"><span class="dot"></span>정상</span>
    </div>
    <div class="detail-name" id="detailName">설비를 선택하세요</div>
    <div class="detail-field"><div class="k">위치</div><div class="v">라인 A · Line-A</div></div>
    <div class="detail-field"><div class="k">설비 유형</div><div class="v" id="detailType">-</div></div>
    <div class="detail-field"><div class="k">설비 ID</div><div class="v" id="detailId">-</div></div>
    <div class="detail-row">
      <div class="detail-field"><div class="k">압력</div><div class="v" id="detailP">-</div></div>
      <div class="detail-field"><div class="k">금형</div><div class="v" id="detailT">-</div></div>
    </div>
    <div class="detail-field"><div class="k">CT</div><div class="v" id="detailCT">-</div></div>
    <div class="recent-status">
      <div class="k">최근 상태</div>
      <div class="v" id="detailRecent">설비 카드를 클릭하면 상세 정보가 표시됩니다</div>
    </div>
  </div>
</div>

<script>
  const stages = [
    { name: '주조', shape: 'circle', color: '#3b6fb0' },
    { name: '가공', shape: 'tri',    color: '#c45a1a' },
    { name: '세척', shape: 'square', color: '#2e7d3f' },
    { name: '조립', shape: 'hex',    color: '#6a4ba8' },
    { name: '검사', shape: 'star',   color: '#c43872' },
  ];

  const equipData = {
    'L1-CAST-01': {name:'주조기 1호', type:'주조기', stage:'주조', status:'normal', p:'17.9bar', t:'211℃', ct:'60.0s'},
    'L1-MACH-01': {name:'가공기 1호', type:'가공기', stage:'가공', status:'normal', p:'14.2bar', t:'85℃',  ct:'42.3s'},
    'L1-MACH-02': {name:'가공기 2호', type:'가공기', stage:'가공', status:'normal', p:'14.5bar', t:'88℃',  ct:'41.8s'},
    'L1-MACH-03': {name:'가공기 3호', type:'가공기', stage:'가공', status:'warn',   p:'15.8bar', t:'97℃',  ct:'45.1s'},
    'L1-WASH-01': {name:'세척기 1호', type:'세척기', stage:'세척', status:'normal', p:'3.2bar',  t:'62℃',  ct:'28.5s'},
    'L1-WASH-02': {name:'세척기 2호', type:'세척기', stage:'세척', status:'normal', p:'3.1bar',  t:'60℃',  ct:'29.0s'},
    'L1-ASSY-01': {name:'조립기 1호', type:'조립기', stage:'조립', status:'normal', p:'8.4bar',  t:'45℃',  ct:'52.0s'},
    'L1-ASSY-02': {name:'조립기 2호', type:'조립기', stage:'조립', status:'alert',  p:'11.2bar', t:'78℃',  ct:'68.4s'},
    'L1-INSP-01': {name:'검사기 1호', type:'검사기', stage:'검사', status:'normal', p:'-',       t:'24℃',  ct:'18.0s'},
    'L1-INSP-02': {name:'검사기 2호', type:'검사기', stage:'검사', status:'normal', p:'-',       t:'24℃',  ct:'18.5s'},
  };

  const statusMap = {
    normal: { label:'정상', cls:'normal', icon:'✓' },
    warn:   { label:'주의', cls:'warn',   icon:'!' },
    alert:  { label:'경고', cls:'alert',  icon:'×' }
  };

  function shapeSvg(shape, color, size) {
    size = size || 28;
    if (shape === 'circle') return `<svg width="${size}" height="${size}" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" stroke="${color}" stroke-width="2.5" fill="none"/></svg>`;
    if (shape === 'tri')    return `<svg width="${size+2}" height="${size}" viewBox="0 0 34 32"><polygon points="17,4 31,28 3,28" stroke="${color}" stroke-width="2.5" fill="none"/></svg>`;
    if (shape === 'square') return `<svg width="${size-2}" height="${size-2}" viewBox="0 0 30 30"><rect x="5" y="5" width="20" height="20" stroke="${color}" stroke-width="2.5" fill="none"/></svg>`;
    if (shape === 'hex')    return `<svg width="${size}" height="${size}" viewBox="0 0 32 32"><polygon points="16,4 28,12 28,24 16,28 4,24 4,12" stroke="${color}" stroke-width="2.5" fill="none"/></svg>`;
    if (shape === 'star')   return `<svg width="${size+2}" height="${size}" viewBox="0 0 34 32"><polygon points="17,3 21,12 31,12 23,19 26,29 17,23 8,29 11,19 3,12 13,12" stroke="${color}" stroke-width="2.2" fill="none"/></svg>`;
    return '';
  }

  function renderFlow() {
    const headerRow = document.getElementById('stageHeaderRow');
    const ddArea = document.getElementById('dropdownArea');
    headerRow.innerHTML = '';
    ddArea.innerHTML = '';

    stages.forEach((stage, idx) => {
      const equips = Object.entries(equipData).filter(([,d]) => d.stage === stage.name);
      const segs = equips.map(([,d]) => {
        const cls = d.status==='normal'?'n':(d.status==='warn'?'w':'a');
        return `<div class="seg ${cls}"></div>`;
      }).join('');

      const btn = document.createElement('button');
      btn.className = 'stage-btn';
      btn.dataset.stage = stage.name;
      btn.innerHTML = `
        <div class="left">
          ${shapeSvg(stage.shape, stage.color, 26)}
          <div class="stage-meta">
            <div class="stage-name">${stage.name}</div>
            <div class="stage-progress">${segs}</div>
          </div>
        </div>
        <div class="right">
          <span class="count-badge">${equips.length}대</span>
          <span class="chevron">▾</span>
        </div>
      `;
      headerRow.appendChild(btn);

      if (idx < stages.length - 1) {
        const arrow = document.createElement('div');
        arrow.className = 'arrow-col';
        arrow.textContent = '→';
        headerRow.appendChild(arrow);
      }

      const dd = document.createElement('div');
      dd.className = 'dropdown';
      dd.dataset.dropdown = stage.name;
      dd.innerHTML = `
        <div class="dropdown-inner">
          <div class="dropdown-title">
            ${shapeSvg(stage.shape, stage.color, 22)}
            <span class="ttl-stage">${stage.name} 공정 설비</span>
            <span class="ttl-line">· 총 ${equips.length}대 · 라인 A</span>
          </div>
          <div class="equip-grid">
            ${equips.map(([id, d]) => `
              <div class="eq ${d.status}" data-id="${id}">
                <div class="shape-wrap">${shapeSvg(stage.shape, stage.color, 32)}</div>
                <div class="info">
                  <div class="eq-name">${d.name}</div>
                  <div class="eq-id">${id}</div>
                </div>
                <div class="eq-metrics">
                  <div class="ct">CT ${d.ct}</div>
                  <div>${d.p !== '-' ? d.p : ''} ${d.t}</div>
                </div>
                <div class="status-icon">${statusMap[d.status].icon}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      ddArea.appendChild(dd);
    });

    bindEvents();
  }

  function bindEvents() {
    document.querySelectorAll('.stage-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const stageName = btn.dataset.stage;
        const dd = document.querySelector(`.dropdown[data-dropdown="${stageName}"]`);
        const isOpen = btn.classList.contains('active');
        if (isOpen) {
          btn.classList.remove('active');
          dd.classList.remove('open');
        } else {
          btn.classList.add('active');
          dd.classList.add('open');
        }
      });
    });

    document.querySelectorAll('.eq').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.eq').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        updateDetail(el.dataset.id);
      });
    });
  }

  function updateDetail(id) {
    const d = equipData[id];
    if (!d) return;
    document.getElementById('detailName').textContent = d.name;
    document.getElementById('detailId').textContent = id;
    document.getElementById('detailType').textContent = d.type;
    document.getElementById('detailP').textContent = d.p;
    document.getElementById('detailT').textContent = d.t;
    document.getElementById('detailCT').textContent = d.ct;
    document.getElementById('detailRecent').textContent =
      `압력 ${d.p} · 금형 ${d.t} · CT ${d.ct}`;
    const s = statusMap[d.status];
    const chip = document.getElementById('detailStatus');
    chip.className = 'chip ' + s.cls;
    chip.innerHTML = '<span class="dot"></span>' + s.label;
  }

  renderFlow();

  window.addEventListener('load', () => {
    const firstBtn = document.querySelector('.stage-btn[data-stage="주조"]');
    if (firstBtn) firstBtn.click();
  });
</script>

</body>
</html>
